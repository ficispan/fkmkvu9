<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FKM KV - Goals</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- =========================
         SCREEN 1 - MATCH SETUP
    ========================== -->
    <section id="screen1" class="screen active">

        <div class="top-bar">
            <div class="club-logo">
                <span>FKM</span>
                <strong>KV</strong>
            </div>
        </div>

        <div class="form-area">

            <label>Opponent</label>
            <input
                type="text"
                id="opponent"
                value="ŠK Slovan"
            >

            <label>Squads</label>

            <div class="select-wrapper">
                <select id="squads">
                    <option value="1">1</option>
                    <option value="2">2</option>
                </select>
            </div>

            <label>Coach</label>

            <div class="select-wrapper">
                <select id="coach">
                    <option value="Peto V.">Peto V.</option>
                    <option value="Mato K.">Mato K.</option>
                </select>
            </div>

            <button class="primary-button" onclick="startMatch()">
                Start
            </button>

        </div>

        <div class="bottom-strip"></div>

    </section>


    <!-- =========================
         SCREEN 2 - PLAYER SELECTION
    ========================== -->
    <section id="screen2" class="screen">

        <div class="top-bar navigation-bar">

            <button class="nav-button" onclick="showScreen(1)">
                ‹
            </button>

            <div class="club-logo small">
                <span>FKM</span>
                <strong>KV</strong>
            </div>

            <button class="nav-button">
                ›
            </button>

        </div>

        <div class="selection-info">

            <span>
                Coach: <span id="selectedCoach">Peto V.</span>
            </span>

            <span>
                Selected: <span id="selectedCount">0</span>
            </span>

        </div>

        <div id="playersGrid" class="players-grid">
            <!-- Players generated by JavaScript -->
        </div>

        <div class="bottom-strip"></div>

    </section>


    <!-- =========================
         SCREEN 3 - GOALS
    ========================== -->
    <section id="screen3" class="screen">

        <div class="score-header">

            <button class="header-button" onclick="showScreen(2)">
                ‹
            </button>

            <button class="output-button" onclick="showOutput()">
                Output
            </button>

            <div class="stopwatch-icon">
                ⏱
            </div>

            <button class="reset-button" onclick="resetScore()">
                Score reset
            </button>

            <div class="timer">
                00:00
            </div>

            <div class="score-line">
                <span>FKM KV</span>
                <strong id="homeScore">9</strong>
                :
                <strong id="awayScore">5</strong>
                <span id="opponentName">ŠK Slovan</span>
            </div>

        </div>

        <div id="scoreRows" class="score-rows">
            <!-- Generated by JS -->
        </div>

        <div class="bottom-strip"></div>

    </section>


    <!-- =========================
         SCREEN 4 - OUTPUT
    ========================== -->
    <section id="screen4" class="screen">

        <div class="output-header">

            <div class="output-logo">
                <div class="club-logo">
                    <span>FKM</span>
                    <strong>KV</strong>
                </div>
            </div>

            <div class="output-score">

                <div class="date">
                    03.10.2026
                </div>

                <div class="teams">
                    <strong>FKM KV</strong>
                    <span>9 : 5</span>
                    <strong id="outputOpponent">
                        ŠK Slovan
                    </strong>
                </div>

                <div class="output-coach">
                    team: Peto V.
                </div>

            </div>

        </div>

        <div class="goals-summary">

            <span>Góly:</span>

            <span id="goalsText">
                Gejdoš 3, Gudkov 2, Kytka 2, Montoya, ŠK Slovan vl.
            </span>

        </div>

        <div id="field" class="field">

            <!-- players generated by JS -->

        </div>

        <div class="output-select">
            <select>
                <option></option>
            </select>
        </div>

        <div class="output-buttons">

            <button class="back-button" onclick="showScreen(3)">
                Back
            </button>

            <button class="pdf-button">
                PDF
            </button>

            <button class="restart-button" onclick="restartGame()">
                Restart
            </button>

        </div>

        <div class="bottom-strip"></div>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
