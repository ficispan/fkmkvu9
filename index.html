<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FKM KV Goals</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- ==================================================
         SCREEN 1 - MATCH SETUP
    =================================================== -->

    <section id="screen1" class="screen active">

        <div class="top-bar">
            <div class="club-logo">
                <div>FKM</div>
                <strong>KV</strong>
            </div>
        </div>

        <div class="setup-form">

            <div class="form-group">
                <label for="opponent">Opponent</label>

                <input
                    type="text"
                    id="opponent"
                    value="ŠK Slovan"
                >
            </div>


            <div class="form-group">
                <label for="squads">Squads</label>

                <div class="custom-select">
                    <select id="squads">
                        <option value="1">1</option>
                        <option value="2">2</option>
                    </select>
                </div>
            </div>


            <div
                id="coachGroup"
                class="form-group coach-group hidden"
            >

                <label for="coach">Coach</label>

                <div class="custom-select">

                    <select id="coach">

                        <option value="Peťo Šiko">
                            Peťo Šiko
                        </option>

                        <option value="Peťo Vrabec">
                            Peťo Vrabec
                        </option>

                    </select>

                </div>

            </div>


            <button
                id="startButton"
                class="red-button"
            >
                Start
            </button>

        </div>


        <div class="bottom-strip"></div>

    </section>


    <!-- ==================================================
         SCREEN 2 - PLAYER SELECTION
    =================================================== -->

    <section id="screen2" class="screen">

        <div class="red-header navigation-header">

            <button
                class="header-arrow"
                id="playersBack"
            >
                ‹
            </button>


            <div class="club-logo small">
                <div>FKM</div>
                <strong>KV</strong>
            </div>


            <button
                class="header-arrow"
                id="playersNext"
            >
                ›
            </button>

        </div>


        <div class="selection-info">

            <div
                id="selectionCoach"
                class="selection-coach"
            >
            </div>

            <div>
                Selected:
                <span id="selectedCount">0</span>
            </div>

        </div>


        <div
            id="playersGrid"
            class="players-grid"
        >
        </div>


        <div class="bottom-strip"></div>

    </section>


    <!-- ==================================================
         SCREEN 3 - GOALS
    =================================================== -->

    <section id="screen3" class="screen">

        <div class="score-header">

            <button
                id="goalsBack"
                class="score-back"
            >
                ‹
            </button>


            <button
                id="outputButton"
                class="output-button"
            >
                Output
            </button>


            <button
                id="timerButton"
                class="timer-button"
            >
                ⏱
            </button>


            <button
                id="resetButton"
                class="reset-button"
            >
                Score reset
            </button>


            <div
                id="timerDisplay"
                class="timer-display"
            >
                00:00
            </div>


            <div class="main-score">

                <span>FKM KV</span>

                <strong id="homeScore">
                    0
                </strong>

                <span>:</span>

                <strong id="awayScore">
                    0
                </strong>

                <span id="gameOpponent">
                    ŠK Slovan
                </span>

            </div>

        </div>


        <div
            id="scoreRows"
            class="score-rows"
        >
        </div>


        <div class="bottom-strip"></div>

    </section>


    <!-- ==================================================
         SCREEN 4 - OUTPUT
    =================================================== -->

    <section id="screen4" class="screen">

        <div class="output-header">

            <div class="output-logo">

                <div class="club-logo">
                    <div>FKM</div>
                    <strong>KV</strong>
                </div>

            </div>


            <div class="output-header-info">

                <div
                    id="outputDate"
                    class="output-date"
                >
                </div>


                <div class="output-teams">

                    <strong>FKM KV</strong>

                    <span id="outputScore">
                        0 : 0
                    </span>

                    <strong id="outputOpponent">
                        ŠK Slovan
                    </strong>

                </div>


                <div
                    id="outputCoach"
                    class="output-coach"
                >
                </div>

            </div>

        </div>


        <div class="goals-summary">

            <span>Góly:</span>

            <span id="goalsText">
                -
            </span>

        </div>


        <div
            id="field"
            class="field"
        >
        </div>


        <div class="output-select">

            <select>
                <option></option>
            </select>

        </div>


        <div class="output-buttons">

            <button
                id="outputBack"
                class="back-button"
            >
                Back
            </button>


            <button
                id="restartButton"
                class="restart-button"
            >
                Restart
            </button>

        </div>


        <div class="bottom-strip"></div>

    </section>

</div>


<script src="script.js"></script>

</body>
</html>
